[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "knowmemo"
version = "0.1.0.dev0"
description = "KnowMemo — a local-first personal memory and knowledge system."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Peixin" }]
keywords = ["memory", "rag", "local-first", "personal-knowledge"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
# Needed only when a snapshot contains zstd-compressed message payloads.
wechat = [
  "zstandard>=0.22",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "zstandard>=0.22",
]

[project.scripts]
knowmemo = "knowmemo.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/knowmemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pytest's default "failed" policy deletes each passing test's tmp_path at
# teardown, and the whole base temp directory at session end. In a sandbox that
# meters deletions per turn, that turns a green suite into a wall of teardown
# errors once the budget runs out — the failures land on whichever tests happen
# to run last, which makes the symptom look like a code bug.
# "none" keeps the directories instead. They live under a single base temp
# directory, so the OS reclaims them; the cost is disk, not correctness.
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's API requires option defaults to be function calls.
"src/knowmemo/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
